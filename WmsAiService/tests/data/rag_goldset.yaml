# RAG Retrieval Gold-Set
#
# Bu dosya, docs RAG retrieval kalitesini olcer.
# Her madde icin:
#   - question: kullanicinin soracagi tipik soru
#   - kind: "literal" | "paraphrase" | "negative"
#   - expected_source_path: pozitif sorularda hedef doc (literal+paraphrase)
#   - expected_section: opsiyonel; section eslesmesi de zorunlu ise
#   - expected_no_info: true ise retrieval'in hicbir chunk getirmemesi (veya
#       en iyi chunk strict thresholdun uzerinde olmasi) beklenir
#   - notes: gerekirse aciklama
#
# Hedefler:
#   - recall@4 >= 0.85 (pozitif sorular icin)
#   - negatif sorular %100 reddedilmeli
#
# Test runner: WmsAiService/tests/test_rag_retrieval_quality.py

# ---------------------------------------------------------------------------
# FEFO
# ---------------------------------------------------------------------------
- question: "FEFO mantigi nedir?"
  kind: literal
  expected_source_path: DOCS/rag/fefo-sureci.md

- question: "Son kullanma tarihi en yakin urun neden once oneriliyor?"
  kind: paraphrase
  expected_source_path: DOCS/rag/fefo-sureci.md

- question: "FEFO ile FIFO arasindaki fark nedir?"
  kind: paraphrase
  expected_source_path: DOCS/rag/fefo-sureci.md

- question: "Blokeli stok FEFO sirasina dahil edilir mi?"
  kind: paraphrase
  expected_source_path: DOCS/rag/fefo-sureci.md

