[pytest]
testpaths = tests
markers =
    unit: Unit testler (DB gerektirmez)
    integration: Integration testler (gercek DB)
    api: API endpoint testleri (gercek DB + HTTP)
    concurrency: Eszamanlilik testleri (gercek DB + threading)
    rabbitmq: Calisir RabbitMQ broker gerektiren testler (opsiyonel; pytest -m rabbitmq ile calistir)
filterwarnings =
    ignore::DeprecationWarning:passlib
