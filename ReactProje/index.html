<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DepoTerminal" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.json" />
    <title>Depo Yönetim Sistemi</title>
    <!-- FOUC Önleme: React yüklenmeden önce tema/mod attribute'larını uygula -->
    <script>
      (function() {
        try {
          var tema = localStorage.getItem('depo_tema') || 'kurumsal';
          var mod  = localStorage.getItem('depo_mod')  || 'acik';
          var resolved = mod;
          if (mod === 'sistem') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'koyu' : 'acik';
          }
          document.documentElement.setAttribute('data-theme', tema);
          document.documentElement.setAttribute('data-mode', resolved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
