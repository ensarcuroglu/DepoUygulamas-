<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Depo Yönetim Sistemi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="palet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="kutu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Raf çatısı (üst kiriş) -->
  <rect x="80" y="120" width="352" height="18" rx="4" fill="#475569"/>
  <!-- Raf dikmeleri -->
  <rect x="80" y="120" width="14" height="296" fill="#64748b"/>
  <rect x="418" y="120" width="14" height="296" fill="#64748b"/>
  <!-- Orta raf rafı (yatay kiriş) -->
  <rect x="80" y="260" width="352" height="14" rx="3" fill="#475569"/>
  <!-- Üst raftaki kutular -->
  <rect x="118" y="160" width="80" height="80" rx="6" fill="url(#kutu)"/>
  <rect x="216" y="160" width="80" height="80" rx="6" fill="url(#kutu)" opacity="0.85"/>
  <rect x="314" y="160" width="80" height="80" rx="6" fill="url(#kutu)" opacity="0.7"/>
  <!-- Üst raf kutu çizgileri -->
  <line x1="158" y1="160" x2="158" y2="240" stroke="#1e3a8a" stroke-width="2" opacity="0.5"/>
  <line x1="256" y1="160" x2="256" y2="240" stroke="#1e3a8a" stroke-width="2" opacity="0.5"/>
  <line x1="354" y1="160" x2="354" y2="240" stroke="#1e3a8a" stroke-width="2" opacity="0.5"/>
  <!-- Alt palet -->
  <rect x="118" y="300" width="276" height="92" rx="4" fill="url(#palet)"/>
  <!-- Palet aralık çizgileri -->
  <rect x="138" y="370" width="32" height="22" fill="#0f172a" opacity="0.85"/>
  <rect x="240" y="370" width="32" height="22" fill="#0f172a" opacity="0.85"/>
  <rect x="342" y="370" width="32" height="22" fill="#0f172a" opacity="0.85"/>
  <!-- Palet üstü çizgiler (tahta görünümü) -->
  <line x1="118" y1="320" x2="394" y2="320" stroke="#92400e" stroke-width="2" opacity="0.5"/>
  <line x1="118" y1="345" x2="394" y2="345" stroke="#92400e" stroke-width="2" opacity="0.5"/>
  <!-- Zemin -->
  <rect x="64" y="416" width="384" height="6" rx="2" fill="#334155"/>
</svg>
