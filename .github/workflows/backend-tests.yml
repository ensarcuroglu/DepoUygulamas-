name: Backend Tests

on:
  push:
    branches: [main]
    paths: 
      - 'BackendProje/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths: ['BackendProje/**']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: depo_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: BackendProje
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Debug File Structure
        working-directory: BackendProje
        run: |
          echo "--- Mevcut Dizin ---"
          pwd
          echo "--- Dosya Listesi (Recursive) ---"
          ls -R
          echo "--- Python Yol Listesi ---"
          python -c "import sys; print('\n'.join(sys.path))"

      - name: Run tests
        working-directory: BackendProje
        env:
          # GitHub Workspace üzerinden tam yol vererek import hatasını kökten çözüyoruz
          PYTHONPATH: ${{ github.workspace }}/BackendProje
          DB_USER: root
          DB_PASSWORD: testpass
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: depo_db_test
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-karakter-uzunlugunda
        # Concurrency testleri ayrı job'da çalıştırılır; ana suite'ten hariç tutulur
        run: python -m pytest tests/ -m "not concurrency" --cov=app --cov-report=term-missing -v

  concurrency-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: depo_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: BackendProje
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run concurrency tests
        working-directory: BackendProje
        env:
          PYTHONPATH: ${{ github.workspace }}/BackendProje
          DB_USER: root
          DB_PASSWORD: testpass
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: depo_db_test
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-karakter-uzunlugunda
        run: python -m pytest tests/ -m concurrency -v --tb=short