name: Backend Tests

on:
  push:
    branches: [main]
    paths: ['BackendProje/**']
  pull_request:
    branches: [main]
    paths: ['BackendProje/**']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: depo_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: BackendProje # İçeri girerek yükleme yap
        run: |
          pip install -r BackendProje/requirements.txt
          pip install -r BackendProje/requirements-test.txt

      - name: Run tests
        working-directory: BackendProje
        env:
          PYTHONPATH: .
          DB_USER: root
          DB_PASSWORD: testpass
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: depo_db_test
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-karakter-uzunlugunda
        run: python -m pytest --cov=. --cov-report=term-missing -v
