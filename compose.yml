name: depo-dev

x-python-common: &python-common
  env_file:
    - ./infra/env/dev.env
    - path: ./infra/env/langfuse.local
      required: false
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - .:/workspace

x-python-build: &python-build
  context: .
  dockerfile: infra/docker/python-service.Dockerfile

services:
  mysql:
    image: mysql:8.4
    env_file:
      - ./infra/env/dev.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    env_file:
      - ./infra/env/dev.env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend-init:
    <<: *python-common
    image: depo-dev-backend:dev
    working_dir: /workspace/BackendProje
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "python seed.py &&
             alembic stamp head &&
             python seed_agv_user.py"
    restart: "no"

  ai-views:
    image: mysql:8.4
    env_file:
      - ./infra/env/dev.env
    depends_on:
      backend-init:
        condition: service_completed_successfully
    volumes:
      - ./WmsAiService/views.sql:/views.sql:ro
    command: >
      sh -c "mysql -hmysql -uroot -p$${MYSQL_ROOT_PASSWORD} depo_yonetim < /views.sql"
    restart: "no"

  backend:
    <<: *python-common
    image: depo-dev-backend:dev
    build:
      <<: *python-build
      args:
        SERVICE_DIR: BackendProje
    working_dir: /workspace/BackendProje
    depends_on:
      mysql:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
      ai-views:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      uvicorn main:app --reload
      --reload-exclude .pytest_cache --reload-exclude .pytest_cache/*
      --reload-exclude __pycache__ --reload-exclude __pycache__/*
      --reload-exclude venv --reload-exclude venv/*
      --reload-exclude .venv --reload-exclude .venv/*
      --host 0.0.0.0 --port 8000

  backend-worker:
    <<: *python-common
    image: depo-dev-backend:dev
    working_dir: /workspace/BackendProje
    depends_on:
      mysql:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    command: >
      python -m app.infrastructure.messaging.operator_performans_consumer
    restart: unless-stopped

  wms-ai:
    <<: *python-common
    image: depo-dev-wms-ai:dev
    build:
      <<: *python-build
      args:
        SERVICE_DIR: WmsAiService
        INSTALL_CPU_TORCH: "true"
    working_dir: /workspace/WmsAiService
    environment:
      DB_USER: depo_ai_reader
      DB_PASSWORD: depo_ai_reader_dev
      HF_HOME: /cache/huggingface
      HF_HUB_CACHE: /cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /cache/sentence-transformers
    volumes:
      - .:/workspace
      - hf_cache:/cache/huggingface
      - sentence_transformers_cache:/cache/sentence-transformers
    depends_on:
      mysql:
        condition: service_healthy
      ai-views:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    command: >
      uvicorn main:app --reload
      --reload-exclude .pytest_cache --reload-exclude .pytest_cache/*
      --reload-exclude __pycache__ --reload-exclude __pycache__/*
      --reload-exclude venv --reload-exclude venv/*
      --reload-exclude .venv --reload-exclude .venv/*
      --host 0.0.0.0 --port 8001

  agv-sim:
    <<: *python-common
    image: depo-dev-agv-sim:dev
    build:
      <<: *python-build
      args:
        SERVICE_DIR: AgvSimService
    working_dir: /workspace/AgvSimService
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8002:8002"
    command: >
      uvicorn main:app --reload
      --reload-exclude .pytest_cache --reload-exclude .pytest_cache/*
      --reload-exclude __pycache__ --reload-exclude __pycache__/*
      --reload-exclude venv --reload-exclude venv/*
      --reload-exclude .venv --reload-exclude .venv/*
      --host 0.0.0.0 --port 8002

  doc-ai:
    <<: *python-common
    image: depo-dev-doc-ai:dev
    build:
      <<: *python-build
      args:
        SERVICE_DIR: DocAiService
    working_dir: /workspace/DocAiService
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8003:8003"
    command: >
      uvicorn main:app --reload
      --reload-exclude .pytest_cache --reload-exclude .pytest_cache/*
      --reload-exclude __pycache__ --reload-exclude __pycache__/*
      --reload-exclude venv --reload-exclude venv/*
      --reload-exclude .venv --reload-exclude .venv/*
      --host 0.0.0.0 --port 8003

  excel-ai:
    <<: *python-common
    image: depo-dev-excel-ai:dev
    build:
      <<: *python-build
      args:
        SERVICE_DIR: ExcelAiService
    working_dir: /workspace/ExcelAiService
    environment:
      # DocAi qwen3-vl:4b kullanir; ExcelAi pandas agent icin code-tuned model gerekir.
      OLLAMA_TEXT_MODEL: qwen2.5-coder:7b
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8004:8004"
    command: >
      uvicorn main:app --reload
      --reload-exclude .pytest_cache --reload-exclude .pytest_cache/*
      --reload-exclude __pycache__ --reload-exclude __pycache__/*
      --reload-exclude venv --reload-exclude venv/*
      --reload-exclude .venv --reload-exclude .venv/*
      --host 0.0.0.0 --port 8004

  # AssistantAiService: tek replica (LangGraph SqliteSaver dosya kilidi).
  # AgvSimService ile ayni kural; replica veya horizontal scale uygulanmamali.
  assistant-ai:
    <<: *python-common
    image: depo-dev-assistant-ai:dev
    build:
      <<: *python-build
      args:
        SERVICE_DIR: AssistantAiService
    working_dir: /workspace/AssistantAiService
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8006:8006"
    volumes:
      - .:/workspace
      - assistant_ai_state:/data
    command: >
      uvicorn main:app --reload
      --reload-exclude .pytest_cache --reload-exclude .pytest_cache/*
      --reload-exclude __pycache__ --reload-exclude __pycache__/*
      --reload-exclude venv --reload-exclude venv/*
      --reload-exclude .venv --reload-exclude .venv/*
      --host 0.0.0.0 --port 8006

  data-gen:
    <<: *python-common
    image: depo-dev-data-gen:dev
    build:
      <<: *python-build
      args:
        SERVICE_DIR: DataGenService
    working_dir: /workspace/DataGenService
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "8005:8005"
    command: >
      uvicorn main:app --reload
      --reload-exclude .pytest_cache --reload-exclude .pytest_cache/*
      --reload-exclude __pycache__ --reload-exclude __pycache__/*
      --reload-exclude venv --reload-exclude venv/*
      --reload-exclude .venv --reload-exclude .venv/*
      --host 0.0.0.0 --port 8005

  frontend:
    image: depo-dev-frontend:dev
    build:
      context: .
      dockerfile: infra/docker/frontend-dev.Dockerfile
    env_file:
      - ./infra/env/dev.env
    working_dir: /workspace/ReactProje
    depends_on:
      backend:
        condition: service_started
      agv-sim:
        condition: service_started
    ports:
      - "5173:5173"
    volumes:
      - ./ReactProje:/workspace/ReactProje
      - react_node_modules:/workspace/ReactProje/node_modules
    command: >
      sh -c "set -eu;
             LOCK_HASH_FILE=node_modules/.package-lock.sha256;
             CURRENT_HASH=$$(sha256sum package-lock.json | cut -d ' ' -f 1);
             INSTALLED_HASH='';
             if [ -f \"$$LOCK_HASH_FILE\" ]; then INSTALLED_HASH=$$(cat \"$$LOCK_HASH_FILE\"); fi;
             if [ ! -d node_modules/.bin ] || [ \"$$INSTALLED_HASH\" != \"$$CURRENT_HASH\" ]; then
               npm ci --no-audit --no-fund --cache node_modules/.npm-cache;
               printf '%s' \"$$CURRENT_HASH\" > \"$$LOCK_HASH_FILE\";
             fi;
             exec npm run dev -- --host 0.0.0.0"

volumes:
  mysql_data:
  rabbitmq_data:
  react_node_modules:
  hf_cache:
  sentence_transformers_cache:
  assistant_ai_state:
